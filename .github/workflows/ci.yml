name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Type-check, build and pack the single-file release
        run: npm run release
      - name: Unit tests
        run: npm test
      - name: Smoke test (served build)
        run: npm run smoke
      - name: Smoke test (single-file build opened from disk)
        run: npm run smoke:release
      - name: Size and load budget
        run: npm run budget
      - name: Scripted raid (fight, loot, extract, death)
        run: npm run smoke:raid
      - name: Scripted raid (single-file build)
        run: npm run smoke:raid:release
      - name: Smoke screenshots and metrics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: tests/out/
          if-no-files-found: ignore
      # Every PR gets a playable build: download the zip, unzip, double-click biophage-*.html.
      - name: Playable build
        uses: actions/upload-artifact@v4
        with:
          name: biophage-playable-${{ github.sha }}
          path: release/biophage-*.html
          retention-days: 30
