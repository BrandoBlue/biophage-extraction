name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but let every main run finish so main's state is always known.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Type-check, build once, pack the single-file release; every browser job tests these exact files.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      suites: ${{ steps.suites.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR merge commit and its base parent, so the suite picker can see what the PR changed.
          fetch-depth: 2
      # Actions minutes are a budget on a private repo, and the raid suites cost ~20 runner-minutes each.
      # main runs every suite. A PR runs smoke, raid and creatures only if it touches the game or its tests;
      # raid-release and raid-hive-release (the same raids against the single-file build) run on main only, smoke still checks that file on PRs.
      - name: Pick browser suites
        id: suites
        run: |
          smoke='{"name":"smoke","run":"npm run smoke && npm run smoke:release && npm run budget"}'
          raid='{"name":"raid","run":"npm run smoke:raid","timeout":50}'
          raidrel='{"name":"raid-release","run":"npm run smoke:raid:release","timeout":50}'
          raidhive='{"name":"raid-hive","run":"npm run smoke:raid:hive","timeout":50}'
          raidhiverel='{"name":"raid-hive-release","run":"npm run smoke:raid:hive:release","timeout":50}'
          creatures='{"name":"creatures","run":"npm run smoke:creatures"}'
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            suites="[$smoke,$raid,$raidrel,$raidhive,$raidhiverel,$creatures]"
          else
            changed=$(git diff --name-only HEAD^1 HEAD)
            echo "$changed"
            if echo "$changed" | grep -qvE '^(docs/|README\.md$|CLAUDE\.md$|assets/LICENSES\.md$)'; then
              suites="[$smoke,$raid,$raidhive,$creatures]"
            else
              suites="[$smoke]"
            fi
          fi
          echo "suites=$suites" >> "$GITHUB_OUTPUT"
          echo "Browser suites: $suites"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check, build and pack the single-file release
        run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            dist/
            release/
          retention-days: 3
      # Every PR gets a playable build: download the zip, unzip, double-click biophage-*.html.
      - name: Playable build
        uses: actions/upload-artifact@v4
        with:
          name: biophage-playable-${{ github.sha }}
          path: release/biophage-*.html
          retention-days: 30

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Headless browser suites run in parallel, each with its own time budget. The build job picks which ones run.
  browser:
    needs: build
    runs-on: ubuntu-latest
    # 35 min per suite unless the entry sets its own. Raid suites render a full raid on the CPU (~6x slower
    # than a laptop), so they get more room; split a suite into two entries before raising this further.
    timeout-minutes: ${{ matrix.timeout || 35 }}
    strategy:
      fail-fast: false
      matrix:
        # The suite list lives in the build job's "Pick browser suites" step. Add new suites there.
        include: ${{ fromJSON(needs.build.outputs.suites) }}
    name: browser (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser comes from Playwright's CDN (cached); system libraries normally come from apt.
      # GitHub's Ubuntu image already ships Chrome and its libraries, so an apt outage must not fail the run:
      # try install-deps, and if the mirrors are down carry on with the image's libraries.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
      - name: Browser system libraries (best effort)
        run: timeout 300 npx playwright install-deps chromium || echo "::warning::apt unavailable, using the runner image's libraries"
      - uses: actions/download-artifact@v4
        with:
          name: build
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
      - name: Screenshots and metrics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.name }}
          path: tests/out/
          if-no-files-found: ignore
