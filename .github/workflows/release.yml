# Cut a release by pushing a tag: git tag v0.1.0 && git push origin v0.1.0
# The tag must match package.json's version. Patch notes come from docs/releases/<tag>.md.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Tag matches package.json
        run: |
          v="v$(node -p "require('./package.json').version")"
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json $v"; exit 1; }
      - run: npm run check
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          [ -f "$notes" ] || { echo "Missing patch notes $notes"; exit 1; }
          prerelease=""; case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" release/biophage-*.html tests/out/smoke-release.png \
            --title "BIOPHAGE: EXTRACTION $GITHUB_REF_NAME" --notes-file "$notes" $prerelease
